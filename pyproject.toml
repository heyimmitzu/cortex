[project]
name = "cortex"
version = "0.1.0"
description = "Local-first meeting notes capture, structuring, and RAG knowledgebase"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "llama-cpp-python>=0.3.34",
    "sentence-transformers>=5.6.1",
    "textual>=8.2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.ruff]
line-length = 100
