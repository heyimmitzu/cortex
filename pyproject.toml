[project]
name = "cortex"
version = "0.1.0"
description = "Local-first meeting notes capture, structuring, and RAG knowledgebase"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=0.60",
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.24",
    "lancedb>=0.13",
    "sentence-transformers>=3.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.ruff]
line-length = 100
