# Central config — all model paths, params, and thresholds live here
# so nothing is hardcoded in src/.

paths:
  model_dir: "model"
  data_dir: "data"
  raw_captures_dir: "data/raw"
  lancedb_dir: "data/lancedb"

llm:
  # GGUF filename inside model/ — download via scripts/download_model.sh
  structuring_model: "gemma-3n-E2B-it-Q4_K_M.gguf"
  answer_model: "gemma-3n-E2B-it-Q4_K_M.gguf"
  n_ctx: 4096
  n_threads: 8

embedding:
  model_name: "intfloat/multilingual-e5-small"

reranker:
  model_name: "BAAI/bge-reranker-v2-m3"

retrieval:
  top_k_retrieve: 20
  top_k_rerank: 5

lancedb:
  table_name: "cortex"
